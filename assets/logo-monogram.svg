<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Allure monogram">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8D6B3"/>
      <stop offset="0.5" stop-color="#C9A84C"/>
      <stop offset="1" stop-color="#A8862F"/>
    </linearGradient>
  </defs>
  <!-- Crest ring -->
  <circle cx="60" cy="60" r="55" fill="none" stroke="url(#gold)" stroke-width="1.5"/>
  <circle cx="60" cy="60" r="49" fill="none" stroke="url(#gold)" stroke-width="0.75" opacity="0.6"/>
  <!-- Serif 'A' built as a mark -->
  <path d="M60 24 L84 92 L74.5 92 L68.6 74.5 L51.4 74.5 L45.5 92 L36 92 Z M54 66.5 L66 66.5 L60 48.5 Z"
        fill="url(#gold)"/>
  <!-- Fragrance accent: a single rising note above the crossbar -->
  <path d="M60 40 C56 46 64 50 60 56" fill="none" stroke="#F8F5EF" stroke-width="1.2" stroke-linecap="round" opacity="0.9"/>
</svg>
